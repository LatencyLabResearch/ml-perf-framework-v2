events {
    worker_connections 1024;
}

http {
    # Include default mime types
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # ── Backend instance pool ──────────────────────────
    upstream backend_pool {
        # Round robin is nginx default
        server instance1:3001;
        server instance2:3002;
        server instance3:3003;

        # Keep connections alive to backend instances
        keepalive 32;
    }

    server {
        listen 3000;

        # ── Keep-alive to k6 (fixes port exhaustion) ──
        keepalive_timeout      65s;
        keepalive_requests     10000;

        # ── Global Proxy Configuration ────────────────
        proxy_http_version         1.1;
        proxy_set_header           Connection "";
        proxy_set_header           Host                       $host;
        proxy_set_header           X-Real-IP                  $remote_addr;
        proxy_set_header           X-Forwarded-For            $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        # Default timeouts
        proxy_connect_timeout      10s;
        proxy_send_timeout         10s;
        proxy_read_timeout         10s;

        # ── Load Balancer Health check ────────────────
        location /lb-health {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","lb":"nginx"}';
        }

        # ── API Routing (Handles the double /api mount) ──
        
        # Route for light sub-paths (e.g., /users/:id, /api/orders/:id)
        location / {
            proxy_pass http://backend_pool;
        }

        # Heavy endpoint — Catch explicit heavy paths to extend read timeouts for heavy queries
        location /heavy {
            proxy_pass         http://backend_pool;
            proxy_read_timeout 30s; # Higher threshold to prevent 504 timeouts on heavy loads
        }

        location /reports/ {
            proxy_pass         http://backend_pool;
            proxy_read_timeout 30s;
        }

        location /analytics/ {
            proxy_pass         http://backend_pool;
            proxy_read_timeout 30s;
        }

        # ── Instance health checks proxy ──────────────
        # Matches what docker-compose checks on individual app ports
        location /health {
            proxy_pass http://backend_pool;
        }

        # ── 502/504 error handling ─────────────────────
        error_page 502 503 504 /gateway_error;
        location = /gateway_error {
            internal;
            add_header Content-Type application/json;
            return 502 '{"error":"Bad Gateway / Service Unavailable"}';
        }
    }
}