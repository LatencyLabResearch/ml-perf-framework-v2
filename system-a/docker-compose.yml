x-app-env: &app-env
  NODE_ENV: production
  LOG_DIR: /app/logging/raw
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: research
  DB_USER: postgres
  DB_PASSWORD: postgres

services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Nginx load balancer ─────────────────────────────────
  nginx:
    image: ${DOCKER_HUB_USER}/system-a-nginx:latest
    build: ./nginx
    ports:
      - "3000:3000"
    depends_on:
      instance1:
        condition: service_healthy
      instance2:
        condition: service_healthy
      instance3:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    restart: unless-stopped

  # ── Node.js Instance 1 ──────────────────────────────────
  instance1:
    image: ${DOCKER_HUB_USER}/system-a-app:latest
    build: .
    user: root
    environment:
      <<: *app-env
      PORT: "3001"
      INSTANCE_ID: instance-1
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3001"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # CHANGED: Points to /health with a shorter 5s interval for quick startup
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Node.js Instance 2 ──────────────────────────────────
  instance2:
    image: ${DOCKER_HUB_USER}/system-a-app:latest
    build: .
    user: root
    environment:
      <<: *app-env
      PORT: "3002"
      INSTANCE_ID: instance-2
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3002"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      # CHANGED: Waits for instance1 to finish creating the database tables first
      instance1:
        condition: service_healthy
    healthcheck:
      # CHANGED: Points to /health
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Node.js Instance 3 ──────────────────────────────────
  instance3:
    image: ${DOCKER_HUB_USER}/system-a-app:latest
    build: .
    user: root
    environment:
      <<: *app-env
      PORT: "3003"
      INSTANCE_ID: instance-3
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3003"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      # CHANGED: Waits for instance1 to finish creating the database tables first
      instance1:
        condition: service_healthy
    healthcheck:
      # CHANGED: Points to /health
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: