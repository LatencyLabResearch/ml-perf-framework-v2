x-app-env: &app-env
  NODE_ENV: production
  LOG_DIR: /app/logging/raw
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: research
  DB_USER: postgres
  DB_PASSWORD: postgres

services:

  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Autoscaler sidecar ──────────────────────────────────
  autoscaler:
    build: ./autoscaler
    image: vipusa/autoscaler:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket
    mem_limit: 256m
    cpus: 0.5
    networks:
      - default
    depends_on:
      instance1:
        condition: service_healthy
      instance2:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── OpenResty ───────────────────────────────────────────
  nginx:
    image: openresty/openresty:alpine
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/lua:/etc/nginx/lua:ro
    ports:
      - "3000:3000"
    depends_on:
      instance1:
        condition: service_healthy
      instance2:
        condition: service_healthy
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    restart: unless-stopped

  # ── Base instance 1 ─────────────────────────────────────
  instance1:
    build: .
    image: vipusa/system-b:latest
    user: root
    environment:
      <<: *app-env
      PORT: "3001"
      INSTANCE_ID: instance-1
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3001"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Base instance 2 ─────────────────────────────────────
  instance2:
    build: .
    user: root
    environment:
      <<: *app-env
      PORT: "3002"
      INSTANCE_ID: instance-2
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3002"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      instance1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Standby instances (profiles — never auto-start) ─────
  instance3:
    build: .
    user: root
    profiles: ["standby"]
    environment:
      <<: *app-env
      PORT: "3003"
      INSTANCE_ID: instance-3
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3003"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      instance1:
        condition: service_healthy

  instance4:
    build: .
    user: root
    profiles: ["standby"]
    environment:
      <<: *app-env
      PORT: "3004"
      INSTANCE_ID: instance-4
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3004"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      instance1:
        condition: service_healthy

  instance5:
    build: .
    user: root
    profiles: ["standby"]
    environment:
      <<: *app-env
      PORT: "3005"
      INSTANCE_ID: instance-5
    volumes:
      - ./experiment_logs:/app/logging
    expose:
      - "3005"
    mem_limit: 1024m
    mem_reservation: 256m
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      instance1:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  default:
    driver: bridge