events {
    worker_connections 8192;
}

http {
    default_type  application/json;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # shared memory for autoscaler pool
    lua_shared_dict autoscaler 10m;

    upstream backend_pool {
        server 127.0.0.1:65535 down;

        balancer_by_lua_file /etc/nginx/lua/balancer.lua;

        keepalive 32;
    }

    server {
        listen 3000;

        keepalive_timeout 65s;
        keepalive_requests 10000;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;

        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        # ── Pool update endpoint ──
        location /internal/pool {
            allow 172.16.0.0/12;
            allow 172.17.0.0/16;
            allow 172.18.0.0/16;
            allow 172.19.0.0/16;
            allow 172.20.0.0/14;
            allow 172.24.0.0/14;
            allow 172.28.0.0/14;
            deny all;

            content_by_lua_block {
                ngx.req.read_body()
                local body = ngx.req.get_body_data()

                if not body then
                    ngx.status = 400
                    ngx.say('{"error":"empty body"}')
                    return
                end

                local cjson = require("cjson.safe")
                local data = cjson.decode(body)

                if not data or type(data.pool) ~= "table" then
                    ngx.status = 400
                    ngx.say('{"error":"invalid json"}')
                    return
                end

                ngx.shared.autoscaler:set("active_pool", cjson.encode(data.pool))

                ngx.say('{"status":"ok"}')
            }
        }

        # ── Debug pool ──
        location /pool-status {
            access_log off;
            content_by_lua_block {
                local pool = ngx.shared.autoscaler:get("active_pool") or "[]"
                ngx.header["Content-Type"] = "application/json"
                ngx.say(pool)
            }
        }

        # ── Health check ──
        location /lb-health {
            return 200 '{"status":"ok","lb":"openresty"}';
        }

        # ── Proxy routes ──
        location / {
            proxy_pass http://backend_pool;
        }

        location /heavy {
            proxy_pass http://backend_pool;
            proxy_read_timeout 30s;
        }

        location /reports/ {
            proxy_pass http://backend_pool;
            proxy_read_timeout 30s;
        }

        location /analytics/ {
            proxy_pass http://backend_pool;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://backend_pool;
        }

        error_page 502 503 504 /gateway_error;

        location = /gateway_error {
            internal;
            return 502 '{"error":"Bad Gateway"}';
        }
    }
}